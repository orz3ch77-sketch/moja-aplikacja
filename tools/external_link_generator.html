<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generator linkow ikon</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #10131f;
      color: #fff;
      display: grid;
      place-items: center;
    }

    main {
      width: min(720px, calc(100% - 32px));
      background: #1c2235;
      border: 1px solid #33405f;
      border-radius: 8px;
      padding: 24px;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 24px;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      color: #cfd6ec;
      font-size: 14px;
    }

    input, textarea {
      box-sizing: border-box;
      width: 100%;
      border: 1px solid #4a5b84;
      border-radius: 6px;
      background: #0e1220;
      color: #fff;
      padding: 12px;
      font-size: 16px;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
      font-family: Consolas, monospace;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 18px 0;
    }

    button {
      border: 0;
      border-radius: 6px;
      background: #7c4dff;
      color: #fff;
      padding: 12px 16px;
      font-size: 15px;
      cursor: pointer;
    }

    button.secondary {
      background: #26324f;
    }

    .error {
      min-height: 20px;
      color: #ff8a80;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Generator JSON linkow ikon</h1>

    <label for="iconName">Nazwa ikony</label>
    <input id="iconName" placeholder="img1_4_5_4_o1" value="img1_4_5_4_o1">

    <label for="url">Adres URL</label>
    <input id="url" placeholder="https://adres-strony.pl">

    <div class="buttons">
      <button type="button" onclick="generateJson()">Generuj JSON</button>
      <button class="secondary" type="button" onclick="copyJson()">Kopiuj</button>
      <button class="secondary" type="button" onclick="downloadJson()">Pobierz JSON</button>
    </div>

    <div id="error" class="error"></div>

    <label for="output">Wynik</label>
    <textarea id="output" spellcheck="false">{}</textarea>
  </main>

  <script>
    function getValues() {
      return {
        iconName: document.getElementById('iconName').value.trim(),
        url: document.getElementById('url').value.trim(),
      };
    }

    function validate(iconName, url) {
      if (!/^img[\d_]+_o\d+$/.test(iconName)) {
        return 'Nazwa musi wygladac np. img1_4_5_4_o1';
      }

      if (!/^https?:\/\//.test(url)) {
        return 'Adres URL musi zaczynac sie od http:// albo https://';
      }

      return '';
    }

    function generateJson() {
      const { iconName, url } = getValues();
      const error = validate(iconName, url);
      document.getElementById('error').textContent = error;

      if (error) {
        return;
      }

      const json = { url };
      document.getElementById('output').value = JSON.stringify(json, null, 2);
    }

    async function copyJson() {
      generateJson();
      const error = document.getElementById('error').textContent;
      if (error) {
        return;
      }

      await navigator.clipboard.writeText(document.getElementById('output').value);
    }

    function downloadJson() {
      generateJson();
      const error = document.getElementById('error').textContent;
      if (error) {
        return;
      }

      const blob = new Blob([document.getElementById('output').value], {
        type: 'application/json',
      });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      const { iconName } = getValues();
      link.download = `${iconName}.json`;
      link.click();
      URL.revokeObjectURL(link.href);
    }
  </script>
</body>
</html>
